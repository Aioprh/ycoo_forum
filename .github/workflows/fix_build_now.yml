name: Repair current Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: flutter --version && dart --version && java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test --dart-define=cronetHttpNoPlay=true

      - name: Release APK build
        run: flutter build apk --release --dart-define=cronetHttpNoPlay=true

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk && ls -lh build/app/outputs/flutter-apk/app-release.apk
