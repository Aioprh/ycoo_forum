name: Repair current Android build

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix_build_now.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - name: Repair, verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/widgets/native_post_content.dart')
          s = p.read_text()
          s = s.replace("String _nodeText(dom.Node node) => node is dom.Text ? node.text : node.text;", "String _nodeText(dom.Node node) => node.text ?? '';" )
          p.write_text(s)
          p = Path('android/gradle.properties')
          s = p.read_text()
          lines = [x for x in s.splitlines() if not x.startswith('org.gradle.jvmargs=') and not x.startswith('org.gradle.daemon=') and not x.startswith('org.gradle.parallel=')]
          lines = ['org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8','org.gradle.daemon=false','org.gradle.parallel=false'] + lines
          p.write_text('\n'.join(lines) + '\n')
          PY
          dart format lib/pages/detail_page.dart lib/widgets/native_post_content.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --debug
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/detail_page.dart lib/widgets/native_post_content.dart android/gradle.properties
          git commit -m 'fix: repair Android build and Gradle memory' || exit 0
          git push origin main
