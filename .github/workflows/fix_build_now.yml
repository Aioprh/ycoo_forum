name: Repair current Dart build errors

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix_build_now.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - name: Repair sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/widgets/native_post_content.dart')
          s = p.read_text()
          s = s.replace("String _nodeText(dom.Node node) => node is dom.Text ? node.text : node.text;", "String _nodeText(dom.Node node) => node.text ?? '';" )
          p.write_text(s)

          p = Path('lib/pages/detail_page.dart')
          s = p.read_text()
          old = "return SafeArea(top: false, child: Container(padding: const EdgeInsets.fromLTRB(12, 8, 12, 8), decoration: BoxDecoration(color: c.surface, border: Border(top: BorderSide(color: c.outlineVariant.withValues(alpha: .45))), boxShadow: [BoxShadow(color: c.shadow.withValues(alpha: .045), blurRadius: 16, offset: const Offset(0, -4))]), child: !_loggedIn ? OutlinedButton.icon(onPressed: _login, icon: const Icon(Icons.login_rounded, size: 18), label: const Text('登录后参与讨论'), style: OutlinedButton.styleFrom(minimumSize: const Size.fromHeight(46), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)))) : Row(crossAxisAlignment: CrossAxisAlignment.end, children: [Expanded(child: TextField(controller: _replyCtrl, focusNode: _replyFocus, minLines: 1, maxLines: 4, textInputAction: TextInputAction.send, onSubmitted: (_) => _reply(), decoration: InputDecoration(hintText: '友善地说点什么…', isDense: true, filled: true, fillColor: c.surfaceContainerHighest.withValues(alpha: .72), border: OutlineInputBorder(borderRadius: BorderRadius.circular(18), borderSide: BorderSide.none), contentPadding: const EdgeInsets.symmetric(horizontal: 15, vertical: 11)))), const SizedBox(width: 7), SizedBox(width: 46, height: 46, child: FilledButton(onPressed: _sending ? null : _reply, style: FilledButton.styleFrom(padding: EdgeInsets.zero, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15))), child: _sending ? const SizedBox(width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2)) : const Icon(Icons.arrow_upward_rounded)))]]));"
          new = "return SafeArea(top: false, child: Container(padding: const EdgeInsets.fromLTRB(12, 8, 12, 8), decoration: BoxDecoration(color: c.surface, border: Border(top: BorderSide(color: c.outlineVariant.withValues(alpha: .45))), boxShadow: [BoxShadow(color: c.shadow.withValues(alpha: .045), blurRadius: 16, offset: const Offset(0, -4))]), child: !_loggedIn ? OutlinedButton.icon(onPressed: _login, icon: const Icon(Icons.login_rounded, size: 18), label: const Text('登录后参与讨论'), style: OutlinedButton.styleFrom(minimumSize: const Size.fromHeight(46), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)))) : Row(crossAxisAlignment: CrossAxisAlignment.end, children: [Expanded(child: TextField(controller: _replyCtrl, focusNode: _replyFocus, minLines: 1, maxLines: 4, textInputAction: TextInputAction.send, onSubmitted: (_) => _reply(), decoration: InputDecoration(hintText: '友善地说点什么…', isDense: true, filled: true, fillColor: c.surfaceContainerHighest.withValues(alpha: .72), border: OutlineInputBorder(borderRadius: BorderRadius.circular(18), borderSide: BorderSide.none), contentPadding: const EdgeInsets.symmetric(horizontal: 15, vertical: 11)))), const SizedBox(width: 7), SizedBox(width: 46, height: 46, child: FilledButton(onPressed: _sending ? null : _reply, style: FilledButton.styleFrom(padding: EdgeInsets.zero, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15))), child: _sending ? const SizedBox(width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2)) : const Icon(Icons.arrow_upward_rounded)))]) ));"
          if old not in s:
              raise SystemExit('composer pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          dart format lib/pages/detail_page.dart lib/widgets/native_post_content.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --debug
      - name: Commit repaired sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/detail_page.dart lib/widgets/native_post_content.dart
          git commit -m 'fix: repair Dart syntax and native post renderer' || exit 0
          git push origin main
