name: Repair current Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - name: Repair, verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/pages/detail_page.dart')
          s = p.read_text()
          start = s.find('  Widget _composer(BuildContext context) {')
          if start < 0:
              raise SystemExit('composer function not found')
          end = s.find('\n  }\n}', start)
          if end < 0:
              raise SystemExit('composer function end not found')
          end += len('\n  }')
          composer = '''  Widget _composer(BuildContext context) {
            final c = Theme.of(context).colorScheme;
            final d = _detail;
            if (d == null || d.isPaid) return const SizedBox.shrink();

            return SafeArea(
              top: false,
              child: Container(
                padding: const EdgeInsets.fromLTRB(12, 8, 12, 8),
                decoration: BoxDecoration(
                  color: c.surface,
                  border: Border(top: BorderSide(color: c.outlineVariant.withValues(alpha: .45))),
                  boxShadow: [
                    BoxShadow(
                      color: c.shadow.withValues(alpha: .045),
                      blurRadius: 16,
                      offset: const Offset(0, -4),
                    ),
                  ],
                ),
                child: !_loggedIn
                    ? OutlinedButton.icon(
                        onPressed: _login,
                        icon: const Icon(Icons.login_rounded, size: 18),
                        label: const Text('登录后参与讨论'),
                        style: OutlinedButton.styleFrom(
                          minimumSize: const Size.fromHeight(46),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                        ),
                      )
                    : Row(
                        crossAxisAlignment: CrossAxisAlignment.end,
                        children: [
                          Expanded(
                            child: TextField(
                              controller: _replyCtrl,
                              focusNode: _replyFocus,
                              minLines: 1,
                              maxLines: 4,
                              textInputAction: TextInputAction.send,
                              onSubmitted: (_) => _reply(),
                              decoration: InputDecoration(
                                hintText: '友善地说点什么…',
                                isDense: true,
                                filled: true,
                                fillColor: c.surfaceContainerHighest.withValues(alpha: .72),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(18),
                                  borderSide: BorderSide.none,
                                ),
                                contentPadding: const EdgeInsets.symmetric(horizontal: 15, vertical: 11),
                              ),
                            ),
                          ),
                          const SizedBox(width: 7),
                          SizedBox(
                            width: 46,
                            height: 46,
                            child: FilledButton(
                              onPressed: _sending ? null : _reply,
                              style: FilledButton.styleFrom(
                                padding: EdgeInsets.zero,
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                              ),
                              child: _sending
                                  ? const SizedBox(
                                      width: 18,
                                      height: 18,
                                      child: CircularProgressIndicator(strokeWidth: 2),
                                    )
                                  : const Icon(Icons.arrow_upward_rounded),
                            ),
                          ),
                        ],
                      ),
              ),
            );
          }'''
          s = s[:start] + composer + s[end:]
          p.write_text(s)

          p = Path('lib/widgets/native_post_content.dart')
          s = p.read_text()
          s = s.replace("String _nodeText(dom.Node node) => node is dom.Text ? node.text : node.text;", "String _nodeText(dom.Node node) => node.text ?? '';")
          p.write_text(s)

          p = Path('android/gradle.properties')
          s = p.read_text()
          lines = [x for x in s.splitlines() if not x.startswith('org.gradle.jvmargs=') and not x.startswith('org.gradle.daemon=') and not x.startswith('org.gradle.parallel=')]
          lines = ['org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8','org.gradle.daemon=false','org.gradle.parallel=false'] + lines
          p.write_text('\n'.join(lines) + '\n')
          PY
          dart format lib/pages/detail_page.dart lib/widgets/native_post_content.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --debug
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/detail_page.dart lib/widgets/native_post_content.dart android/gradle.properties
          git commit -m 'fix: repair Android build and Gradle memory' || exit 0
          git push origin main
