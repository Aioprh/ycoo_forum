name: Repair profile page and Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Repair profile statistics parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/services/profile_service.dart')
          s = p.read_text(encoding='utf-8')

          old = """    final credits = _numberNearLabel(doc, ['星币', '源币', '金币', '余额']);
              final points = _numberNearLabel(doc, ['积分', '贡献']);"""
          if old not in s:
              old = """    final credits = _numberNearLabel(doc, ['星币', '源币', '金币', '余额']);
          final points = _numberNearLabel(doc, ['积分', '贡献']);"""
          if old not in s:
              raise SystemExit('profile stats assignments not found')

          new = """    final stats = _profileStats(doc);
          final credits = stats['星币'] ?? _numberNearLabel(doc, ['星币', '源币', '金币', '余额']);
          final points = stats['积分'] ?? _numberNearLabel(doc, ['积分', '贡献']);"""
          s = s.replace(old, new, 1)

          marker = '  static int? _numberFromHref(dom.Document doc, bool Function(String href) matches) {'
          if marker not in s:
              raise SystemExit('profile stats marker not found')

          helper = r'''  static Map<String, int> _profileStats(dom.Document doc) {
    const labels = ['主题', '回帖', '关注', '粉丝', '星币', '积分'];
    final result = <String, int>{};

    int? onlyNumber(String value) {
      final text = _clean(value);
      if (!RegExp(r'^\d{1,12}$').hasMatch(text)) return null;
      return int.tryParse(text);
    }

    int? near(String value, String label) {
      final text = _clean(value);
      final before = RegExp(r'(\d{1,12})[^0-9]{0,16}' + RegExp.escape(label)).firstMatch(text);
      final after = RegExp(RegExp.escape(label) + r'[^0-9]{0,16}(\d{1,12})').firstMatch(text);
      final match = before ?? after;
      return match == null ? null : int.tryParse(match.group(1)!);
    }

    // The Ycoo mobile profile uses a compact six-stat block. Depending on the
    // template version it is either number+label pairs or a number row followed
    // by a label row. Parse that block as a unit so UID/other page numbers cannot
    // leak into the "积分" value.
    final selectors = <String>[
      '#uhd .tns', '#uhd .tns ul', '#uhd .tns table',
      '.comiis_space_stats', '.comiis_space_statistics',
      '.comiis_space_num', '.comiis_space_data', '.comiis_space_info',
      '.space_stats', '.space-stat', '.user-stats', '.profile-stats',
      '[class*="space_stats"]', '[class*="profile_stats"]', '[class*="user_stats"]',
    ];

    for (final selector in selectors) {
      for (final box in doc.querySelectorAll(selector)) {
        final boxText = _clean(box.text);
        if (boxText.isEmpty || boxText.length > 600) continue;

        // Pair-style markup: each item contains exactly one label and one number.
        for (final item in box.querySelectorAll('li,th,td,div,span,a,p')) {
          final text = _clean(item.text);
          if (text.isEmpty || text.length > 80) continue;
          for (final label in labels) {
            if (result.containsKey(label) || !text.contains(label)) continue;
            final n = near(text, label);
            if (n != null) result[label] = n;
          }
        }

        // Two-row markup: collect pure numeric leaves and labels in DOM order.
        final nums = <int>[];
        for (final node in box.querySelectorAll('strong,b,em,span,p,li,th,td,a')) {
          final n = onlyNumber(node.text);
          if (n != null) nums.add(n);
        }
        final presentLabels = <String>[];
        for (final node in box.querySelectorAll('strong,b,em,span,p,li,th,td,a')) {
          final text = _clean(node.text);
          for (final label in labels) {
            if (text == label && !presentLabels.contains(label)) presentLabels.add(label);
          }
        }
        if (presentLabels.length >= 2 && nums.length >= presentLabels.length) {
          for (var i = 0; i < presentLabels.length; i++) {
            result.putIfAbsent(presentLabels[i], () => nums[i]);
          }
        }

        // A single stat may be rendered in a parent with text like "1 积分".
        for (final label in labels) {
          if (result.containsKey(label)) continue;
          for (final node in box.querySelectorAll('li,th,td,div,span,a,p,strong,em')) {
            final n = near(node.text, label);
            if (n != null) { result[label] = n; break; }
          }
        }
      }
    }

    // Discuz/Ycoo also exposes the total forum credit in semantic id/class names.
    // This fallback is intentionally restricted to credit-like nodes.
    if (!result.containsKey('积分')) {
      for (final node in doc.querySelectorAll('*')) {
        final marker = '${node.id} ${node.classes.join(' ')}'.toLowerCase();
        if (!(marker.contains('credit') || marker.contains('point') || marker.contains('integral'))) continue;
        final text = _clean(node.text);
        final m = RegExp(r'(?<!\d)(\d{1,12})(?!\d)').firstMatch(text);
        if (m != null && text.length <= 80) {
          result['积分'] = int.tryParse(m.group(1)!);
          if (result['积分'] != null) break;
        }
      }
    }
    return result;
  }

'''
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

          dart format lib/services/profile_service.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/profile_service.dart .github/workflows/fix_profile_stats.yml
          rm -f .github/workflows/fix_profile_stats.yml
          git add -u .github/workflows/fix_profile_stats.yml
          if ! git diff --cached --quiet; then
            git commit -m 'fix: parse profile statistics from stat block'
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --dart-define=cronetHttpNoPlay=true

      - name: Android release build
        run: flutter build apk --release --dart-define=cronetHttpNoPlay=true
