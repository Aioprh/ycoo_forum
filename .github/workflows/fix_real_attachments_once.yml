name: Fix real attachment parsing
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch parser
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/services/attachment_download_service.dart')
          s = p.read_text(encoding='utf-8')
          marker = '    return result;\n  }\n\n  bool _isRealFileAttachment(Uri uri)'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('parser marker not found')
          insertion = '''    // ycoo/Discuz 的真实附件有时保留 BBCode [attach]URL[/attach]，不会生成 <a>。
    attach_re = RegExp(r'\\[attach(?:ment)?\\]\\s*(https?://[^\\s\\[\\]<>]+)\\s*\\[/attach(?:ment)?\\]', caseSensitive: false);
    for (final m in attach_re.allMatches(source)) {
      final url = _normalizeUrl(m.group(1)!);
      final uri = Uri.tryParse(url);
      if (uri == null || !_isRealFileAttachment(uri)) continue;
      final name = _bestFileName('', uri);
      if (_looksLikeImageFile(name, uri)) continue;
      final key = uri.queryParameters['aid']?.trim() ?? url;
      if (!seen.add(key)) continue;
      result.add(ForumAttachmentInfo(url: url, name: name));
    }

'''
          s = s[:pos] + insertion + s[pos:]
          p.write_text(s, encoding='utf-8')
      - name: Verify
        run: grep -n "attach_re" lib/services/attachment_download_service.dart
      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/attachment_download_service.dart
          git commit -m 'fix: parse Discuz attach markers as real files'
          git rm -f .github/workflows/fix_real_attachments_once.yml .github/workflows/fix_attachment_parser_once.yml || true
          git add -A
          git commit -m 'chore: remove temporary attachment workflows' || true
          git push origin HEAD:main
