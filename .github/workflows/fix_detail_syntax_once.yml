name: One-time detail syntax repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'Aioprh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair detail page
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/pages/detail_page.dart')
          s = p.read_text()

          header = r'''  Widget _header(BuildContext context, ThreadDetail d) {
    final s = Theme.of(context).colorScheme;
    return Container(
      margin: const EdgeInsets.fromLTRB(12, 0, 12, 8),
      padding: const EdgeInsets.fromLTRB(18, 18, 18, 16),
      decoration: BoxDecoration(
        color: s.surface,
        borderRadius: BorderRadius.circular(22),
        border: Border.all(color: s.outlineVariant.withValues(alpha: .5)),
      ),
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          if (d.boardName.isNotEmpty)
            GestureDetector(
