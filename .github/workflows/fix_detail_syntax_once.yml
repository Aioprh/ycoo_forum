'''
          actions = r'''  Widget _actions(BuildContext context, ThreadDetail d) {
    final s = Theme.of(context).colorScheme;

    Widget button(
      IconData icon,
      String label, {
      int? count,
      bool active = false,
      required VoidCallback onTap,
    }) {
      return Expanded(
        child: Material(
          color: active ? s.primary.withValues(alpha: .12) : Colors.transparent,
          borderRadius: BorderRadius.circular(13),
          child: InkWell(
            borderRadius: BorderRadius.circular(13),
            onTap: onTap,
            child: Padding(
              padding: const EdgeInsets.symmetric(vertical: 9),
              child: Row(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  Icon(icon, size: 19, color: active ? s.primary : s.onSurfaceVariant),
                  const SizedBox(width: 5),
                  Text(
                    label,
                    style: TextStyle(
                      fontSize: 13,
                      fontWeight: active ? FontWeight.w700 : FontWeight.w500,
                      color: active ? s.primary : s.onSurfaceVariant,
                    ),
                  ),
                  if (count != null && count > 0) ...[
                    const SizedBox(width: 3),
                    Text('$count', style: TextStyle(fontSize: 12, color: active ? s.primary : s.onSurfaceVariant)),
                  ],
                ],
              ),
            ),
          ),
        ),
      );
    }

    return Padding(
      padding: const EdgeInsets.fromLTRB(16, 4, 16, 10),
      child: Container(
        padding: const EdgeInsets.all(5),
        decoration: BoxDecoration(
          color: s.surfaceContainerHighest.withValues(alpha: .6),
          borderRadius: BorderRadius.circular(17),
        ),
        child: Row(
          children: [
            button(
              _liked ? Icons.favorite_rounded : Icons.favorite_border_rounded,
              _liked ? '已点赞' : '点赞',
              count: _likeCount,
              active: _liked,
              onTap: () => _like(d),
            ),
            const SizedBox(width: 4),
            button(
              _favorited ? Icons.star_rounded : Icons.star_border_rounded,
              _favorited ? '已收藏' : '收藏',
              active: _favorited,
              onTap: () => _favorite(d),
            ),
            const SizedBox(width: 4),
            button(Icons.reply_rounded, '回复', onTap: () => _replyFocus.requestFocus()),
          ],
        ),
      ),
    );
  }

'''
          paid = r'''  Widget _paidNotice(BuildContext context, ThreadDetail d) {
    final s = Theme.of(context).colorScheme;
    return Container(
      margin: const EdgeInsets.fromLTRB(12, 0, 12, 12),
      padding: const EdgeInsets.all(24),
      decoration: BoxDecoration(
        gradient: LinearGradient(colors: [s.primaryContainer, s.surface]),
        borderRadius: BorderRadius.circular(22),
        border: Border.all(color: s.outlineVariant.withValues(alpha: .5)),
      ),
      child: Column(
        children: [
          Container(
            width: 64,
            height: 64,
            decoration: BoxDecoration(color: s.primary.withValues(alpha: .12), shape: BoxShape.circle),
            child: Icon(Icons.lock_rounded, size: 30, color: s.primary),
          ),
          const SizedBox(height: 14),
          const Text('这是一个付费主题', style: TextStyle(fontSize: 17, fontWeight: FontWeight.w800)),
          const SizedBox(height: 5),
          Text(
            d.price == null ? '购买后即可查看完整内容' : '支付 ${d.price} ${d.currency} 后查看完整内容',
            textAlign: TextAlign.center,
            style: TextStyle(color: s.onSurfaceVariant),
          ),
          const SizedBox(height: 17),
          FilledButton.icon(
            onPressed: _buying ? null : _purchase,
            icon: _buying
                ? const SizedBox(width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2))
                : const Icon(Icons.shopping_bag_outlined),
            label: Text(_buying ? '购买中…' : '购买主题'),
          ),
        ],
      ),
    );
  }

'''
          empty = r'''  Widget _empty(BuildContext context, String text) {
    final s = Theme.of(context).colorScheme;
    return Container(
      margin: const EdgeInsets.fromLTRB(12, 0, 12, 12),
      padding: const EdgeInsets.symmetric(vertical: 40),
      decoration: BoxDecoration(
        color: s.surface,
        borderRadius: BorderRadius.circular(22),
      ),
      child: Center(
        child: Text(text, style: TextStyle(color: s.onSurfaceVariant)),
      ),
    );
  }

'''
          composer = r'''  Widget _composer(BuildContext context) {
    final s = Theme.of(context).colorScheme;
    final d = _detail;
    if (d == null || d.isPaid) return const SizedBox.shrink();
    if (!_loggedIn) {
      return SafeArea(
        top: false,
        child: Container(
          padding: const EdgeInsets.fromLTRB(16, 9, 16, 9),
          decoration: BoxDecoration(
            color: s.surface,
            border: Border(top: BorderSide(color: s.outlineVariant.withValues(alpha: .45))),
          ),
          child: OutlinedButton.icon(
            onPressed: _login,
            icon: const Icon(Icons.login_rounded, size: 18),
            label: const Text('登录后参与讨论'),
            style: OutlinedButton.styleFrom(minimumSize: const Size.fromHeight(46)),
          ),
        ),
      );
    }
    return SafeArea(
      top: false,
      child: Container(
        padding: const EdgeInsets.fromLTRB(12, 8, 12, 8),
        decoration: BoxDecoration(
          color: s.surface,
          border: Border(top: BorderSide(color: s.outlineVariant.withValues(alpha: .45))),
        ),
        child: Row(
          crossAxisAlignment: CrossAxisAlignment.end,
          children: [
            Expanded(
              child: TextField(
                controller: _replyCtrl,
                focusNode: _replyFocus,
                minLines: 1,
                maxLines: 4,
                textInputAction: TextInputAction.send,
                onSubmitted: (_) => _reply(),
                decoration: InputDecoration(
                  hintText: '友善地说点什么…',
                  isDense: true,
                  filled: true,
                  fillColor: s.surfaceContainerHighest.withValues(alpha: .65),
                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(22), borderSide: BorderSide.none),
                  enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(22), borderSide: BorderSide.none),
                  focusedBorder: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(22),
                    borderSide: BorderSide(color: s.primary.withValues(alpha: .45)),
                  ),
                  contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
                ),
              ),
            ),
            const SizedBox(width: 6),
            Material(
              color: s.primary,
              shape: const CircleBorder(),
              child: IconButton(
                onPressed: _sending ? null : _reply,
                icon: _sending
                    ? const SizedBox(width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2, color: Colors.white))
                    : const Icon(Icons.arrow_upward_rounded, color: Colors.white),
              ),
            ),
          ],
        ),
      ),
    );
  }
'''

          s = re.sub(r'  Widget _header\(BuildContext context, ThreadDetail d\) \{.*?\n  \}\n\n(?=  Widget _actions)', header, s, count=1, flags=re.S)
          s = re.sub(r'  Widget _actions\(BuildContext context, ThreadDetail d\) \{.*?\n  \}\n\n(?=  Widget _paidNotice)', actions, s, count=1, flags=re.S)
          s = re.sub(r'  Widget _paidNotice\(BuildContext context, ThreadDetail d\) \{.*?\n  \}\n\n(?=  Widget _empty)', paid, s, count=1, flags=re.S)
          s = re.sub(r'  Widget _empty\(BuildContext context, String text\).*?\n\n(?=  Widget _composer)', empty, s, count=1, flags=re.S)
          s = re.sub(r'  Widget _composer\(BuildContext context\) \{.*?\n  \}\s*$', composer, s, count=1, flags=re.S)

          p.write_text(s)
          print('detail_page.dart repaired')

      - name: Verify syntax
        run: flutter --version && dart analyze lib/pages/detail_page.dart --no-fatal-infos --no-fatal-warnings

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix_detail_syntax_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/detail_page.dart .github/workflows/fix_detail_syntax_once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair detail page syntax'
          git push