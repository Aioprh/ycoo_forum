name: Auto repair Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci: auto repair Android build') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Repair Dart syntax and nullability
        shell: python
        run: |
          from pathlib import Path

          detail = Path('lib/pages/detail_page.dart')
          text = detail.read_text(encoding='utf-8')

          start = text.find('  Widget _composer(BuildContext context) {')
          if start == -1:
              raise SystemExit('composer function not found')
          end = text.find('\n  }\n}', start)
          if end == -1:
              raise SystemExit('composer function end not found')
          end += len('\n  }')

          composer = '''  Widget _composer(BuildContext context) {
    final c = Theme.of(context).colorScheme;
    final d = _detail;
    if (d == null || d.isPaid) return const SizedBox.shrink();

    return SafeArea(
      top: false,
      child: Container(
        padding: const EdgeInsets.fromLTRB(12, 8, 12, 8),
        decoration: BoxDecoration(
          color: c.surface,
          border: Border(top: BorderSide(color: c.outlineVariant.withValues(alpha: .45))),
          boxShadow: [
            BoxShadow(
              color: c.shadow.withValues(alpha: .045),
              blurRadius: 16,
              offset: const Offset(0, -4),
            ),
          ],
        ),
        child: !_loggedIn
            ? OutlinedButton.icon(
                onPressed: _login,
                icon: const Icon(Icons.login_rounded, size: 18),
                label: const Text('登录后参与讨论'),
                style: OutlinedButton.styleFrom(
                  minimumSize: const Size.fromHeight(46),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                ),
              )
            : Row(
                crossAxisAlignment: CrossAxisAlignment.end,
                children: [
                  Expanded(
                    child: TextField(
                      controller: _replyCtrl,
                      focusNode: _replyFocus,
                      minLines: 1,
                      maxLines: 4,
                      textInputAction: TextInputAction.send,
                      onSubmitted: (_) => _reply(),
                      decoration: InputDecoration(
                        hintText: '友善地说点什么…',
                        isDense: true,
                        filled: true,
                        fillColor: c.surfaceContainerHighest.withValues(alpha: .72),
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(18),
                          borderSide: BorderSide.none,
                        ),
                        contentPadding: const EdgeInsets.symmetric(horizontal: 15, vertical: 11),
                      ),
                    ),
                  ),
                  const SizedBox(width: 7),
                  SizedBox(
                    width: 46,
                    height: 46,
                    child: FilledButton(
                      onPressed: _sending ? null : _reply,
                      style: FilledButton.styleFrom(
                        padding: EdgeInsets.zero,
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                      ),
                      child: _sending
                          ? const SizedBox(
                              width: 18,
                              height: 18,
                              child: CircularProgressIndicator(strokeWidth: 2),
                            )
                          : const Icon(Icons.arrow_upward_rounded),
                    ),
                  ),
                ],
              ),
      ),
    );
  }'''
          text = text[:start] + composer + text[end:]
          detail.write_text(text, encoding='utf-8')

          post = Path('lib/widgets/native_post_content.dart')
          ptext = post.read_text(encoding='utf-8')
          ptext = ptext.replace(
              "String _nodeText(dom.Node node) => node is dom.Text ? node.text : node.text;",
              "String _nodeText(dom.Node node) => node.text ?? '';",
          )
          post.write_text(ptext, encoding='utf-8')

      - name: Verify analyzer
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/detail_page.dart lib/widgets/native_post_content.dart
          git commit -m "ci: auto repair Android build"
          git push origin HEAD:main
