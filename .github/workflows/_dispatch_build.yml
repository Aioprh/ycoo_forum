name: Dispatch formal build
on:
  push:
    branches: [main]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch formal build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Aioprh/ycoo_forum/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'
      - name: Remove dispatcher workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git rm .github/workflows/_dispatch_build.yml
          git commit -m "chore: remove build dispatcher"
          git push origin main
