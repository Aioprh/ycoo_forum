name: 修正个人资料页 UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 修正个人资料页
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) 恢复“我的页”原来的积分铭牌；这次需求只针对“个人资料页”。
          p = Path('lib/pages/profile_page.dart')
          s = p.read_text(encoding='utf-8')
          old = """                              _accountBadge(icon: Icons.diamond_outlined, text: _level ?? '等级'),\n                              _accountBadge(icon: Icons.school_outlined, text: _cleanRankText(_rank)),\n                              _accountBadge(icon: Icons.payments_outlined, text: _coins == null ? '星币' : '星币 $_coins'),"""
          new = """                              _accountBadge(icon: Icons.diamond_outlined, text: _level ?? '等级'),\n                              _accountBadge(icon: Icons.school_outlined, text: _cleanRankText(_rank)),\n                              _accountBadge(icon: Icons.stars_outlined, text: _points == null ? '积分' : '积分 $_points'),\n                              _accountBadge(icon: Icons.payments_outlined, text: _coins == null ? '星币' : '星币 $_coins'),"""
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('profile_page.dart: 未找到需要恢复的铭牌代码')
          p.write_text(s, encoding='utf-8')

          # 2) 个人资料页：头像旁边只显示昵称，等级/品级做独立铭牌，不显示积分。
          p = Path('lib/pages/native_profile_page.dart')
          s = p.read_text(encoding='utf-8')
          start = s.index('class _Header extends StatelessWidget {')
          end = s.index('\nclass _Stats extends StatelessWidget', start)
          header = r'''class _Header extends StatelessWidget {
            final ProfileData profile;
            final String username;
            final VoidCallback onFollow, onChat;
            final bool busy;
            const _Header({required this.profile, required this.username, required this.onFollow, required this.onChat, required this.busy});

            List<String> _badges() {
              final value = profile.group.trim();
              if (value.isEmpty) return const [];
              final result = <String>[];
              final level = RegExp(r'Lv\\.?\\s*\\d+', caseSensitive: false).firstMatch(value)?.group(0);
              if (level != null && level.isNotEmpty) result.add(level.replaceAll(RegExp(r'\\s+'), ''));
              const ranks = ['童生','秀才','举人','进士','探花','榜眼','状元','九品','八品','七品','六品','五品','四品','三品','二品','一品'];
              for (final rank in ranks) {
                if (value.contains(rank)) { result.add(rank); break; }
              }
              return result;
            }

            Widget _badge(BuildContext context, String text, IconData icon) {
              final s = Theme.of(context).colorScheme;
              return Container(
                padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                decoration: BoxDecoration(
                  color: s.surface.withValues(alpha: 0.78),
                  borderRadius: BorderRadius.circular(8),
                  border: Border.all(color: s.outlineVariant.withValues(alpha: 0.65)),
                ),
                child: Row(mainAxisSize: MainAxisSize.min, children: [
                  Icon(icon, size: 13, color: s.primary),
                  const SizedBox(width: 4),
                  Text(text, style: TextStyle(fontSize: 11, fontWeight: FontWeight.w700, color: s.onSurface)),
                ]),
              );
            }

            @override Widget build(BuildContext context) {
              final s = Theme.of(context).colorScheme;
              final badges = _badges();
              return Container(
                decoration: BoxDecoration(gradient: LinearGradient(begin: Alignment.topLeft, end: Alignment.bottomRight, colors: [s.primaryContainer, s.surface])),
                child: SafeArea(bottom: false, child: Padding(
                  padding: const EdgeInsets.fromLTRB(20, 70, 20, 18),
                  child: Row(crossAxisAlignment: CrossAxisAlignment.end, children: [
                    CircleAvatar(
                      radius: 38,
                      backgroundColor: s.surface,
                      backgroundImage: profile.avatar.isNotEmpty ? NetworkImage(profile.avatar) : null,
                      child: profile.avatar.isEmpty ? Text(username.isEmpty ? '?' : username.characters.first, style: const TextStyle(fontSize: 28, fontWeight: FontWeight.w700)) : null,
                    ),
                    const SizedBox(width: 14),
                    Expanded(child: Column(mainAxisAlignment: MainAxisAlignment.end, crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text(username, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.w800)),
                      const SizedBox(height: 3),
                      Text('UID ${profile.uid}', style: TextStyle(fontSize: 13, color: s.onSurfaceVariant, fontWeight: FontWeight.w600)),
                      if (badges.isNotEmpty) ...[
                        const SizedBox(height: 7),
                        Wrap(spacing: 5, runSpacing: 5, children: [
                          for (var i = 0; i < badges.length; i++) _badge(context, badges[i], i == 0 && badges[i].toLowerCase().startsWith('lv') ? Icons.diamond_outlined : Icons.school_outlined),
                        ]),
                      ],
                    ])),
                    Column(mainAxisSize: MainAxisSize.min, children: [
                      FilledButton.tonalIcon(onPressed: busy ? null : onFollow, icon: Icon(profile.followedByMe ? Icons.check : Icons.person_add_alt_1), label: Text(profile.followedByMe ? '已关注' : '关注')),
                      const SizedBox(height: 6),
                      OutlinedButton.icon(onPressed: onChat, icon: const Icon(Icons.chat_bubble_outline, size: 18), label: const Text('聊天')),
                    ]),
                  ]),
                )),
              );
            }
          }
          '''
          s = s[:start] + header + s[end:]
          p.write_text(s, encoding='utf-8')

          # 3) 资料解析：优先从个人资料页的用户等级区域提取 Lv.x + 品级，避免把“积分”混入用户组。
          p = Path('lib/services/profile_service.dart')
          s = p.read_text(encoding='utf-8')
          old = """    final group = _clean(doc.querySelector('.comiis_space_level, .gm, .xg1, a[href*=\"gid=\"]')?.text ?? '');"""
          new = """    final group = _profileBadges(doc, text);"""
          if old not in s:
              raise SystemExit('profile_service.dart: 未找到 group 解析代码')
          s = s.replace(old, new, 1)
          marker = """  static String _avatar(dom.Document doc, int uid) {"""
          helper = r'''  static String _profileBadges(dom.Document doc, String text) {
    final values = <String>[];
    for (final selector in ['.comiis_space_level', '.comiis_space_user .gm', '.gm', 'a[href*="gid="]']) {
      for (final node in doc.querySelectorAll(selector)) {
        final value = _clean(node.text);
        if (value.isNotEmpty && value.length <= 80 && !values.contains(value)) values.add(value);
      }
    }
    final combined = values.join(' ');
    final source = '$combined $text';
    final parts = <String>[];
    final level = RegExp(r'Lv\\.?\\s*\\d+', caseSensitive: false).firstMatch(source)?.group(0);
    if (level != null) parts.add(level.replaceAll(RegExp(r'\\s+'), ''));
    const ranks = ['童生','秀才','举人','进士','探花','榜眼','状元','九品','八品','七品','六品','五品','四品','三品','二品','一品'];
    for (final rank in ranks) {
      if (source.contains(rank)) { parts.add(rank); break; }
    }
    if (parts.isNotEmpty) return parts.join(' ');
    return _clean(combined);
  }

'''
          if marker not in s:
              raise SystemExit('profile_service.dart: 未找到插入位置')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: 检查格式
        run: |
          dart format lib/pages/profile_page.dart lib/pages/native_profile_page.dart lib/services/profile_service.dart
          git diff --check

      - name: 提交修复并移除一次性工作流
        shell: bash
        run: |
          rm -f .github/workflows/repair_personal_profile_page.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/profile_page.dart lib/pages/native_profile_page.dart lib/services/profile_service.dart .github/workflows/repair_personal_profile_page.yml
          git diff --cached --quiet && exit 0
          git commit -m "修正个人资料页昵称与等级铭牌"
          git push origin HEAD:main
