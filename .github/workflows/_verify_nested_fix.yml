name: verify nested comment fix
on: push
permissions:
  contents: write
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}'
      - name: Remove verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_verify_nested_fix.yml
          git commit -m "chore: remove temporary nested comment verifier"
          git push
