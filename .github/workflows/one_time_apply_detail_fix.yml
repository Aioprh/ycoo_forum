name: Apply detail fix once
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply fix
        run: python3 scripts/one_time_detail_fix.py
      - name: Commit fix and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/one_time_detail_fix.py .github/workflows/one_time_apply_detail_fix.yml
          git add lib/services/api_service.dart lib/pages/detail_page.dart
          git commit -m 'fix: render purchased post content and remove blank webview space'
          git push origin main
