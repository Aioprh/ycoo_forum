name: Restore nested comments

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore automatic nested comment loading
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/widgets/native_comment_list.dart')
          s = p.read_text(encoding='utf-8')
          old = "if (widget.tid > 0 && widget.comment.replyCount > 0) {\n      WidgetsBinding.instance.addPostFrameCallback((_) => _loadReplies());\n    }"
          new = "if (widget.tid > 0) {\n      WidgetsBinding.instance.addPostFrameCallback((_) => _loadReplies());\n    }"
          if old not in s:
              raise SystemExit('target initState block not found')
          s = s.replace(old, new, 1)
          old = "_loadingReplies = false;\n        // 后台预热只缓存数据，不自动展开；父评论始终保持可见。\n        if (replies.isEmpty && widget.comment.replyCount > 0) {"
          new = "_loadingReplies = false;\n        // 自动加载成功后直接展示楼中楼；普通评论解析为空则不显示空容器。\n        _repliesExpanded = replies.isNotEmpty;\n        if (replies.isEmpty && widget.comment.replyCount > 0) {"
          if old not in s:
              raise SystemExit('target loadReplies block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/native_comment_list.dart .github/workflows/_restore_nested_comments.yml
          git commit -m "fix: restore automatic nested comment display" || exit 0
          git rm .github/workflows/_restore_nested_comments.yml
          git commit --amend --no-edit
          git push
