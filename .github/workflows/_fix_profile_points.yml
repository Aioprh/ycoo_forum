name: Fix profile points parsing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: make profile stats parsing exact') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile stats parser
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/services/profile_service.dart')
          text = path.read_text(encoding='utf-8')

          old = "    final points = _numberNearLabel(doc, ['积分', '贡献']);"
          new = "    final points = _numberByExactLabel(doc, ['积分', '贡献']);"
          if old not in text:
              raise SystemExit('points assignment not found')
          text = text.replace(old, new, 1)

          marker = "  static int _numberNearLabel(dom.Document doc, List<String> labels) {"
          if marker not in text:
              raise SystemExit('_numberNearLabel marker not found')

          helper = '''  static int _numberByExactLabel(dom.Document doc, List<String> labels) {
    final wanted = labels.map(_clean).where((e) => e.isNotEmpty).toList();
    for (final node in doc.querySelectorAll('li,dt,dd,th,td,a,span,div,p,strong,em')) {
      final own = _clean(node.text);
      if (own.isEmpty || own.length > 80) continue;
      for (final label in wanted) {
        if (!own.contains(label)) continue;
        final direct = _numberBesideLabel(own, label);
        if (direct != null) return direct;

        final parent = node.parent;
        if (parent == null) continue;
        for (final sibling in parent.children) {
          final siblingText = _clean(sibling.text);
          if (siblingText.isEmpty || siblingText.length > 80) continue;
          final value = _numberBesideLabel(siblingText, label);
          if (value != null) return value;
        }
      }
    }
    return 0;
  }

  static int? _numberBesideLabel(String text, String label) {
    final escaped = RegExp.escape(label);
    final patterns = <RegExp>[
      RegExp('$escaped\\\\s*[:：]?\\\\s*([0-9]{1,12})(?![0-9])'),
      RegExp('([0-9]{1,12})(?![0-9])\\\\s*$escaped'),
    ];
    for (final pattern in patterns) {
      final match = pattern.firstMatch(text);
      if (match == null) continue;
      final value = int.tryParse(match.group(1)!);
      if (value != null) return value;
    }
    return null;
  }

'''
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/services/profile_service.dart .github/workflows/_fix_profile_points.yml
          git commit -m 'fix: make profile stats parsing exact'
          git rm .github/workflows/_fix_profile_points.yml
          git commit -m 'chore: remove one-shot profile points patcher'
          git push
