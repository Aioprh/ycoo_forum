name: 临时修复附件显示
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate attachment section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/pages/detail_page.dart')
          s=p.read_text(encoding='utf-8')
          if "../widgets/forum_attachment_section.dart" not in s:
              marker="import '../widgets/native_post_content.dart';"
              s=s.replace(marker, marker+"\nimport '../widgets/forum_attachment_section.dart';",1)
          marker="if (d.commentsHtml.trim().isNotEmpty) _commentsSection(context, d),"
          if 'ForumAttachmentSection(' not in s:
              if marker not in s: raise SystemExit('comments marker missing')
              add="""if (d.tid > 0)\n              ForumAttachmentSection(\n                tid: d.tid,\n                cookie: AuthService.instance.authCookie,\n                referer: SiteConfig.base,\n              ),\n          """
              s=s.replace(marker,add+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/detail_page.dart
          git rm .github/workflows/fix_attachment_section_once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore visible attachment download options'
          git push