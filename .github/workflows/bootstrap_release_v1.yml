name: 构建并发布正式版

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签，例如 v1.0.1'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  release:
    name: 构建 Android 正式版并发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 准备 APK
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/ycoo_forum-${TAG}.apk"
          sha256sum "release/ycoo_forum-${TAG}.apk" > release/SHA256SUMS.txt

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "release/ycoo_forum-${TAG}.apk" release/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "release/ycoo_forum-${TAG}.apk" release/SHA256SUMS.txt \
              --title "源论坛 ${TAG} 正式版" \
              --generate-notes
          fi
