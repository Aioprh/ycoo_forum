name: fix build error
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/pages/detail_page.dart')
          s = p.read_text()
          old = "NativeCommentList(html: d.commentsHtml, commentPage: _commentPage)"
          new = "NativeCommentList(html: d.commentsHtml)"
          if old not in s:
              raise SystemExit('target call not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/detail_page.dart .github/workflows/_fix_build_error.yml
          git commit -m "fix: remove unsupported commentPage argument"
          git push
