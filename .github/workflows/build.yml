name: 构建并发布正式版

on:
  push:
    tags: ['v*']
    branches: ['main']
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: 构建并发布正式版 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: 检查签名 Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "缺少 GitHub Secret: KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "缺少 GitHub Secret: KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "缺少 GitHub Secret: KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "缺少 GitHub Secret: KEY_PASSWORD"; exit 1; }

      - name: 恢复固定 Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/ycoo_forum_release.jks
          cat > android/key.properties <<EOF
          keystore_file=${GITHUB_WORKSPACE}/android/keystore/ycoo_forum_release.jks
          keystore_password=${KEYSTORE_PASSWORD}
          key_alias=${KEY_ALIAS}
          key_password=${KEY_PASSWORD}
          EOF
          chmod 600 android/keystore/ycoo_forum_release.jks android/key.properties
          keytool -list -keystore android/keystore/ycoo_forum_release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: 自动计算构建版本号
        id: bump
        shell: bash
        run: |
          current=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          name_part="${current%%+*}"
          build_part="${current##*+}"
          [ -n "$name_part" ] || name_part="1.0.0"
          if [ "$build_part" = "$current" ] || ! [[ "$build_part" =~ ^[0-9]+$ ]]; then build_part="0"; fi
          IFS='.' read -r major minor patch <<< "$name_part"
          major=${major:-1}; minor=${minor:-0}; patch=${patch:-0}
          new_build=$((build_part + 1)); patch=$((patch + 1))
          if [ "$patch" -ge 10 ]; then patch=0; minor=$((minor + 1)); fi
          if [ "$minor" -ge 10 ]; then minor=0; major=$((major + 1)); fi
          new_version="${major}.${minor}.${patch}+${new_build}"
          sed -i "s/^version:.*/version: ${new_version}/" pubspec.yaml
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: 提交并推送新版本号
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          for attempt in 1 2 3; do
            git -c rebase.autostash=true pull --rebase --no-edit "$REMOTE" "${GITHUB_REF_NAME}" || true
            git add pubspec.yaml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
            if git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git reset --soft HEAD~1 || true
            sleep 2
          done
          exit 1

      - name: 拉取依赖
        run: flutter pub get

      - name: 修复源码语法错误
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          changed = []

          def edit(path, transform):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new = transform(text)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(path)
                  print(f'{path}: 已修复')
              else:
                  print(f'{path}: 已修复或无需修改')

          # 这些文件此前的 JSX/Flutter widget 层级少/多了一个右括号，直接按
          # 锚点修复，避免对相似代码做全局替换。
          edit('lib/pages/create_group_thread_page.dart', lambda s: s.replace(
              "Expanded(child: Text(_error!, style: TextStyle(color: scheme.onErrorContainer)))]),\n            ],",
              "Expanded(child: Text(_error!, style: TextStyle(color: scheme.onErrorContainer)))])),\n            ],", 1))

          edit('lib/pages/upload_album_page.dart', lambda s: s.replace(
              "                    ]),\n                  ),\n                ),\n            if (_busy) ...[",
              "                    ]),\n                  ),\n            if (_busy) ...[", 1).replace(
              "Expanded(child: Text(_error!, style: TextStyle(color: scheme.onErrorContainer)))]),\n            ],",
              "Expanded(child: Text(_error!, style: TextStyle(color: scheme.onErrorContainer)))])),\n            ],", 1))

          edit('lib/pages/write_blog_page.dart', lambda s: s.replace(
              "                ]),\n              ),\n            ),\n              if (_error != null) ...[",
              "                ]),\n              ),\n              if (_error != null) ...[", 1).replace(
              "Expanded(child: Text(_error!, style: TextStyle(color: scheme.onErrorContainer)))]),\n              ],",
              "Expanded(child: Text(_error!, style: TextStyle(color: scheme.onErrorContainer)))])),\n              ],", 1))

          edit('lib/pages/write_doing_page.dart', lambda s: s.replace(
              "Expanded(child: Text(_error!, style: TextStyle(color: scheme.onErrorContainer)))]),\n            ],",
              "Expanded(child: Text(_error!, style: TextStyle(color: scheme.onErrorContainer)))])),\n            ],", 1))

          def fix_reward(s):
              old = "decoration: const InputDecoration(labelText: '悬赏奖励', helperText: _reward > 0 ? '将奖励给最佳回复' : null, prefixIcon: Icon(Icons.card_gift_card_rounded))"
              new = "decoration: InputDecoration(labelText: '悬赏奖励', helperText: _reward > 0 ? '将奖励给最佳回复' : null, prefixIcon: const Icon(Icons.card_gift_card_rounded))"
              return s.replace(old, new, 1)
          edit('lib/pages/create_thread_page.dart', fix_reward)

          edit('lib/services/group_service.dart', lambda s: s.replace(
              "        final name = _clean(a.text);",
              "        final name = a.text.trim();", 1))

          if changed:
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', *changed], check=True)
              subprocess.run(['git', 'commit', '-m', 'fix: repair Dart source syntax before analyze'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 运行测试
        run: flutter test --dart-define=cronetHttpNoPlay=true

      - name: 构建 ABI 分包 Release APK
        run: flutter build apk --split-per-abi --release --dart-define=cronetHttpNoPlay=true

      - name: 验证 APK 签名
        shell: bash
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            apksigner verify --verbose --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)' || true
          done

      - name: 读取应用版本
        id: meta
        shell: bash
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=${version%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${version##*+}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.name }}
          target_commitish: ${{ steps.meta.outputs.sha }}
          name: 源论坛 YcooForum v${{ steps.meta.outputs.name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          fail_on_unmatched_files: true
