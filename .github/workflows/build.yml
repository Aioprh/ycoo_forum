name: 构建并发布正式版

on:
  push:
    tags: ['v*']
    branches: ['main']
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: 构建并发布正式版 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: 检查签名 Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "缺少 GitHub Secret: KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "缺少 GitHub Secret: KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "缺少 GitHub Secret: KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "缺少 GitHub Secret: KEY_PASSWORD"; exit 1; }

      - name: 恢复固定 Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/ycoo_forum_release.jks
          cat > android/key.properties <<EOF
          keystore_file=${GITHUB_WORKSPACE}/android/keystore/ycoo_forum_release.jks
          keystore_password=${KEYSTORE_PASSWORD}
          key_alias=${KEY_ALIAS}
          key_password=${KEY_PASSWORD}
          EOF
          chmod 600 android/keystore/ycoo_forum_release.jks android/key.properties
          keytool -list -keystore android/keystore/ycoo_forum_release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "固定 Release 签名验证通过"

      - name: 自动计算构建版本号
        id: bump
        shell: bash
        run: |
          current=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          name_part="${current%%+*}"
          build_part="${current##*+}"
          if [ -z "$name_part" ]; then name_part="1.0.0"; fi
          if [ "$build_part" = "$current" ] || ! [[ "$build_part" =~ ^[0-9]+$ ]]; then build_part="0"; fi
          IFS='.' read -r major minor patch <<< "$name_part"
          major=${major:-1}
          minor=${minor:-0}
          patch=${patch:-0}
          new_build=$((build_part + 1))
          patch=$((patch + 1))
          if [ "$patch" -ge 10 ]; then
            patch=0
            minor=$((minor + 1))
            if [ "$minor" -ge 10 ]; then
              minor=0
              major=$((major + 1))
            fi
          fi
          new_version="${major}.${minor}.${patch}+${new_build}"
          sed -i "s/^version:.*/version: ${new_version}/" pubspec.yaml
          echo "新版本号: ${new_version}"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: 提交并推送新版本号
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          # sed 之后的 pubspec 是未暂存改动, rebase 会因此拒绝;
          # 开启 autostash 由 git 自动保存/还原未暂存改动, 避免构建失败。
          # 反复 pull --rebase + push, 兼容并发的其它 CI 运行(版本号回写)。
          for attempt in 1 2 3; do
            git -c rebase.autostash=true pull --rebase --no-edit "$REMOTE" "${GITHUB_REF_NAME}" || true
            git add pubspec.yaml
            if git diff --cached --quiet; then
              echo "版本号无变化，跳过提交"
              exit 0
            fi
            git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
            if git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"; then
              echo "已推送版本号提交"
              exit 0
            fi
            echo "push 被拒绝(可能并发), 尝试第 ${attempt} 次"
            git reset --soft HEAD~1 || true
            sleep 2
          done
          echo "版本号提交在重试后仍失败"
          exit 1

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 运行测试
        run: flutter test --dart-define=cronetHttpNoPlay=true

      - name: 构建 ABI 分包 Release APK
        run: flutter build apk --split-per-abi --release --dart-define=cronetHttpNoPlay=true

      - name: 验证 APK 签名
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "验证: $apk"
            apksigner verify --verbose --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)' || true
          done

      - name: 读取应用版本
        id: meta
        shell: bash
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=${version%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${version##*+}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.name }}
          target_commitish: ${{ steps.meta.outputs.sha }}
          name: 源论坛 YcooForum v${{ steps.meta.outputs.name }}
          generate_release_notes: true
          body: |
            ## 源论坛 YcooForum v${{ steps.meta.outputs.name }}

            Android 正式版 APK（按 ABI 拆分）：

            - **arm64-v8a**：适用于主流 64 位 ARM 机型（推荐）
            - **armeabi-v7a**：适用于较旧的 32 位 ARM 机型
            - **x86_64**：适用于 x86_64 模拟器 / 部分设备

            - 数据来源：https://www.ycoo.net
            - 项目地址：https://github.com/Aioprh/ycoo_forum
            - 安装提示：请选择与你的设备 CPU 架构匹配的包；不确定时优先选 **arm64-v8a**
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          fail_on_unmatched_files: true
