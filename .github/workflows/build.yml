name: 构建并发布正式版

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布正式版 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: 检查环境
        run: flutter --version && dart --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 运行测试
        run: flutter test --dart-define=cronetHttpNoPlay=true

      - name: 构建 Release APK
        run: flutter build apk --release --dart-define=cronetHttpNoPlay=true

      - name: 读取应用版本
        id: meta
        shell: bash
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: main
          name: 源论坛 YcooForum v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          body: |
            ## 源论坛 YcooForum v${{ steps.meta.outputs.version }}

            Android 正式版 APK。

            - 数据来源：https://www.ycoo.net
            - 项目地址：https://github.com/Aioprh/ycoo_forum
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
