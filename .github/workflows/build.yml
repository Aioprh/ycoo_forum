name: 构建并发布正式版

on:
  push:
    tags: ['v*']
    branches: ['main']
    paths:
      - 'android/app/src/main/res/drawable/ic_launcher_foreground_small.xml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布正式版 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: 检查环境
        run: flutter --version && dart --version

      - name: 自动递增版本号
        shell: bash
        run: |
          current=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          name_part="${current%%+*}"
          build_part="${current##*+}"
          if [ -z "$name_part" ]; then name_part="1.0.0"; fi
          if [ "$build_part" = "$current" ]; then build_part="0"; fi
          # 递增语义版本名(patch)，确保检测更新无论新旧包都能通过版本名可靠发现
          IFS='.' read -r major minor patch <<< "$name_part"
          [ -z "$major" ] && major=1
          [ -z "$minor" ] && minor=0
          [ -z "$patch" ] && patch=0
          new_patch=$((patch + 1))
          new_build=$((build_part + 1))
          new_version="${major}.${minor}.${new_patch}+${new_build}"
          sed -i "s/^version:.*/version: ${new_version}/" pubspec.yaml
          echo "新版本号: ${new_version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动递增版本号至 ${new_version}"
            git push origin main
          fi

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 运行测试
        run: flutter test --dart-define=cronetHttpNoPlay=true

      - name: 构建 ABI 分包 Release APK
        run: flutter build apk --split-per-abi --release --dart-define=cronetHttpNoPlay=true

      - name: 读取应用版本
        id: meta
        shell: bash
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=${version%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${version##*+}" >> "$GITHUB_OUTPUT"

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: main
          name: 源论坛 YcooForum v${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.build }})
          generate_release_notes: true
          body: |
            ## 源论坛 YcooForum v${{ steps.meta.outputs.name }} (build ${{ steps.meta.outputs.build }})

            Android 正式版 APK（按 ABI 拆分）：

            - **arm64-v8a**：适用于主流 64 位 ARM 机型（推荐）
            - **armeabi-v7a**：适用于较旧的 32 位 ARM 机型
            - **x86_64**：适用于 x86_64 模拟器 / 部分设备

            - 数据来源：https://www.ycoo.net
            - 项目地址：https://github.com/Aioprh/ycoo_forum
            - 安装提示：请选择与你的设备 CPU 架构匹配的包；不确定时优先选 **arm64-v8a**
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          fail_on_unmatched_files: true