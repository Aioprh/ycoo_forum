name: 构建并发布 APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Flutter 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter(3.47.2 stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: 检查环境
        run: flutter --version && dart --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 修复已知源码语法错误
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 这些语法错误来自历史自动修改，必须在分析前恢复为合法 Dart。
          p = Path('lib/services/api_service.dart')
          lines = p.read_text(encoding='utf-8').splitlines()
          if len(lines) >= 404:
              lines[385] = '''    return _firstInt(RegExp(r'''"'''(?:id=["'](?:pid|post_))(\\d+)'''"''', caseSensitive: false), html) ?? 0;'''
              lines[403] = '''      final uid = _firstInt(RegExp(r'''"'''(?:[?&]uid=|data-uid=["'])(\\d+)'''"''', caseSensitive: false), post.outerHtml) ?? 0;'''
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          p = Path('lib/pages/profile_page.dart')
          lines = p.read_text(encoding='utf-8').splitlines()
          if len(lines) >= 274:
              lines[273] = "              Row(children: [const Text('每日签到', style: TextStyle(fontSize: 16, fontWeight: FontWeight.w800)), if (done) const Padding(padding: EdgeInsets.only(left: 6), child: Text('已完成', style: TextStyle(fontSize: 9, fontWeight: FontWeight.w700)))]),"
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 运行测试
        run: flutter test --dart-define=cronetHttpNoPlay=true

      - name: 构建 APK
        id: build
        run: |
          flutter build apk --release --dart-define=cronetHttpNoPlay=true
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ycooforum.apk
          echo "apk-path=dist/ycooforum.apk" >> "$GITHUB_OUTPUT"

      - name: 计算版本号
        id: meta
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ycooforum-${{ steps.meta.outputs.version }}
          path: ${{ steps.build.outputs.apk-path }}
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Release(打 v 标签时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 源论坛 v${{ steps.meta.outputs.version }}
          body: |
            ## 源论坛 YcoForum v${{ steps.meta.outputs.version }}
            - Flutter 3.47.2 / Dart 3.13(stable) 云端自动构建
            - APK 使用 debug 密钥签名，可直接安装
            - 数据来自 https://www.ycoo.net
          files: ${{ steps.build.outputs.apk-path }}
          fail_on_unmatched_files: true