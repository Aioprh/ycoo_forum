name: 构建并发布 APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Flutter 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter(3.47.2 stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: 检查环境
        run: flutter --version && dart --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 运行测试
        run: flutter test --dart-define=cronetHttpNoPlay=true

      - name: 构建 APK
        id: build
        run: |
          flutter build apk --release --dart-define=cronetHttpNoPlay=true
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ycooforum.apk
          echo "apk-path=dist/ycooforum.apk" >> "$GITHUB_OUTPUT"

      - name: 计算版本号
        id: meta
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ycooforum-${{ steps.meta.outputs.version }}
          path: ${{ steps.build.outputs.apk-path }}
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Release(打 v 标签时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 源论坛 v${{ steps.meta.outputs.version }}
          body: |
            ## 源论坛 YcoForum v${{ steps.meta.outputs.version }}
            - Flutter 3.47.2 / Dart 3.13(stable) 云端自动构建
            - APK 使用 debug 密钥签名，可直接安装
            - 数据来自 https://www.ycoo.net
          files: ${{ steps.build.outputs.apk-path }}
          fail_on_unmatched_files: true