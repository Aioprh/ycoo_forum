name: Finalize native post renderer

on:
  push:
    branches: [fix/adaptive-post-body]
    paths:
      - '.github/workflows/native_cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adaptive-post-body
          fetch-depth: 0
      - name: Finalize native-only implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          p.write_text(p.read_text().replace('  webview_flutter: ^4.10.0\n', ''))
          p = Path('lib/pages/detail_page.dart')
          p.write_text(p.read_text().replace("      final changed = oldBody != newBody;\n", ''))
          p = Path('lib/widgets/native_post_content.dart')
          s = p.read_text()
          s = s.replace("        final src = e.attributes['src']?.trim() ?? '';\n        return src.isEmpty ? const SizedBox.shrink() : _ImageBlock(src: src, alt: e.attributes['alt']);", "        final rawSrc = e.attributes['src']?.trim() ?? '';\n        final src = _resolveUrl(rawSrc);\n        return src.isEmpty ? const SizedBox.shrink() : _ImageBlock(src: src, alt: e.attributes['alt']);")
          marker = 'class _ImageBlock extends StatelessWidget {'
          helper = "String _resolveUrl(String value) {\n  if (value.isEmpty) return '';\n  if (value.startsWith('//')) return 'https:$value';\n  if (value.startsWith('/')) return 'https://www.ycoo.net$value';\n  if (!value.startsWith('http://') && !value.startsWith('https://')) return 'https://www.ycoo.net/$value';\n  return value;\n}\n\n"
          if helper not in s: s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          for name in ['.github/workflows/native_post_migration.yml', '.github/workflows/native_cleanup.yml']:
              Path(name).unlink(missing_ok=True)
          PY
      - name: Commit final cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml lib/pages/detail_page.dart lib/widgets/native_post_content.dart .github/workflows
          git commit -m 'refactor: make post detail renderer fully native [skip ci]' || exit 0
          git push origin fix/adaptive-post-body
