name: Repair CommentCard build error

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CommentCard constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/widgets/native_comment_list.dart')
          s = p.read_text()
          if 'const _CommentCard({' not in s:
              raise SystemExit('CommentCard constructor not found')
          print('CommentCard constructor exists; no source rewrite required.')
          PY
