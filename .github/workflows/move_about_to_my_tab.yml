name: Move About into My tab
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move About entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/pages/profile_page.dart')
          s = p.read_text(encoding='utf-8')
          old = "          _featureTile(icon: Icons.info_outline_rounded, title: '关于', subtitle: '项目地址、版本与更新', onTap: _openAbout),\n"
          if old in s:
              s = s.replace(old, '', 1)
          needle = "      _featureTile(icon: Icons.manage_accounts_outlined, title: '帐号设置', subtitle: '帐号资料与安全', onTap: _openEdit),\n"
          insert = needle + "      _sectionHeader(context, '其他'),\n      _featureTile(icon: Icons.info_outline_rounded, title: '关于', subtitle: '项目地址、版本与更新', onTap: _openAbout),\n"
          if needle not in s:
              raise SystemExit('帐号设置入口未找到，停止修改')
          if "_sectionHeader(context, '其他')" not in s:
              s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "Aioprh"
          git config user.email "108421380+Aioprh@users.noreply.github.com"
          git add lib/pages/profile_page.dart
          git rm .github/workflows/move_about_to_my_tab.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: place About entry in My tab"
            git push origin HEAD:main
          fi
