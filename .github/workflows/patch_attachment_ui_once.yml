name: 一次性附件 UI 修复
on:
  push:
    paths:
      - '.github/workflows/patch_attachment_ui_once.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch attachment UI
        shell: python
        run: |
          from pathlib import Path
          import re

          detail = Path('lib/pages/detail_page.dart')
          s = detail.read_text(encoding='utf-8')

          if "../widgets/forum_attachment_section.dart" not in s:
              marker = "import '../widgets/native_post_content.dart';"
              if marker in s:
                  s = s.replace(marker, marker + "\nimport '../widgets/forum_attachment_section.dart';", 1)
              else:
                  raise SystemExit('detail_page import marker not found')

          if 'ForumAttachmentSection(' not in s:
              body_marker = "if (d.commentsHtml.trim().isNotEmpty) _commentsSection(context, d),"
              insert = "if (d.tid > 0)\n                  ForumAttachmentSection(\n                    tid: d.tid,\n                    cookie: AuthService.instance.authCookie,\n                    referer: SiteConfig.base,\n                  ),\n                "
              if body_marker in s:
                  s = s.replace(body_marker, insert + body_marker, 1)
              else:
                  raise SystemExit('detail_page body marker not found')

          detail.write_text(s, encoding='utf-8')

          # Prevent attachment.php/mod=attachment URLs from being mistaken for image previews.
          # Only actual image extensions are treated as images here.
          s = detail.read_text(encoding='utf-8')
          start = s.find('bool _isImageFileUrl(')
          if start >= 0:
              brace = s.find('{', start)
              if brace < 0:
                  raise SystemExit('image helper opening brace not found')
              depth = 0
              end = -1
              for i in range(brace, len(s)):
                  if s[i] == '{': depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end < 0:
                  raise SystemExit('image helper closing brace not found')
              replacement = '''bool _isImageFileUrl(Uri uri) {
  final path = uri.path.toLowerCase();
  final query = uri.query.toLowerCase();
  final value = '$path?$query';
  if (value.contains('attachment.php') || value.contains('mod=attachment')) {
    final f = RegExp(r'(?:^|[?&])_f=([^&]+)').firstMatch(query)?.group(1) ?? '';
    final name = RegExp(r'(?:^|[?&])(?:filename|file|name)=([^&]+)').firstMatch(query)?.group(1) ?? '';
    final candidate = (f.isNotEmpty ? f : name).toLowerCase();
    return RegExp(r'\\.(?:jpe?g|png|gif|webp|bmp|svg|heic|heif|avif)$').hasMatch(candidate);
  }
  return RegExp(r'\\.(?:jpe?g|png|gif|webp|bmp|svg|heic|heif|avif)(?:$|[?#])').hasMatch(value);
}'''
              s = s[:start] + replacement + s[end:]
              detail.write_text(s, encoding='utf-8')

          # The renderer no longer needs to display the removed generic marker.
          # Keep the existing renderer untouched so normal post HTML remains stable.

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/detail_page.dart
          git rm .github/workflows/patch_attachment_ui_once.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: show real thread attachments'
          git push