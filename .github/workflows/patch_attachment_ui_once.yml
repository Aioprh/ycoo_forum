name: 一次性附件 UI 修复
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Flutter files
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/widgets/native_post_content.dart')
          s = p.read_text(encoding='utf-8')
          imp = "import '../services/site_config.dart';"
          if "../widgets/forum_attachment_section.dart" not in s:
              s = s.replace(imp, imp + "\nimport 'forum_attachment_section.dart';", 1)

          start = s.find('class _AttachmentCard extends StatelessWidget {')
          if start < 0:
              raise SystemExit('attachment card class not found')
          brace = s.find('{', start)
          depth = 0
          end = -1
          for i in range(brace, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end < 0:
              raise SystemExit('attachment card end not found')

          replacement = r'''class _AttachmentCard extends StatelessWidget {
  final String href;
  final String title;
  final VoidCallback? onTap;

  const _AttachmentCard({
    required this.href,
    required this.title,
    this.onTap,
  });

  @override
  Widget build(BuildContext context) {
    final lower = href.toLowerCase();
    if (lower.contains('ycoo=all')) {
      final uri = Uri.tryParse(href);
      final tid = int.tryParse(uri?.queryParameters['tid'] ?? '') ?? 0;
      if (tid > 0) {
        return ForumAttachmentSection(
          tid: tid,
          cookie: AuthService.instance.authCookie,
          referer: SiteConfig.base,
        );
      }
    }

    final c = Theme.of(context).colorScheme;
    final label = title.isNotEmpty ? title : '下载附件';
    return Padding(
      padding: const EdgeInsets.only(bottom: 13),
      child: Material(
        color: c.secondaryContainer.withValues(alpha: .45),
        borderRadius: BorderRadius.circular(12),
        child: InkWell(
          borderRadius: BorderRadius.circular(12),
          onTap: onTap,
          child: Padding(
            padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12),
            child: Row(
              children: [
                Icon(Icons.attach_file_rounded, color: c.primary, size: 24),
                const SizedBox(width: 12),
                Expanded(
                  child: Text(
                    label,
                    maxLines: 2,
                    overflow: TextOverflow.ellipsis,
                    style: const TextStyle(fontSize: 14.5, height: 1.3),
                  ),
                ),
                const SizedBox(width: 8),
                Icon(Icons.download_rounded, color: c.primary, size: 20),
              ],
            ),
          ),
        ),
      ),
    );
  }
}'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          # Keep the one-shot workflow itself out of the final repository.
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/native_post_content.dart
          git rm .github/workflows/patch_attachment_ui_once.yml
          git commit -m 'fix: render real attachment cards in posts'
          git push