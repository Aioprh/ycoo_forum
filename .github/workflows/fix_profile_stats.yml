name: Fix profile statistics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-profile-stats
  cancel-in-progress: true

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch profile parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/services/profile_service.dart')
          s = p.read_text(encoding='utf-8')

          old = """    final credits = _numberNearLabel(doc, ['星币', '源币', '金币', '余额']);
              final points = _numberNearLabel(doc, ['积分', '贡献']);"""
          if old not in s:
              old = """    final credits = _numberNearLabel(doc, ['星币', '源币', '金币', '余额']);
    final points = _numberNearLabel(doc, ['积分', '贡献']);"""
          new = """    final stats = _profileStats(doc);
    final credits = stats['星币'] ?? _numberNearLabel(doc, ['星币', '源币', '金币', '余额']);
    final points = stats['积分'] ?? _numberNearLabel(doc, ['积分', '贡献']);"""
          if old not in s:
              raise SystemExit('profile stats assignment block not found')
          s = s.replace(old, new, 1)

          marker = '  static int? _numberFromHref(dom.Document doc, bool Function(String href) matches) {'
          helper = r'''  static Map<String, int> _profileStats(dom.Document doc) {
    const labels = ['主题', '回帖', '关注', '粉丝', '星币', '积分'];
    final result = <String, int>{};

    int? number(String value) {
      final m = RegExp(r'(?<!\d)(\d{1,12})(?!\d)').firstMatch(_clean(value));
      return m == null ? null : int.tryParse(m.group(1)!);
    }

    // Ycoo's mobile profile template can render a six-column statistic block
    // as two rows: all numbers first, then all labels. Map them by DOM order.
    final containers = <dom.Element>[];
    for (final selector in [
      '#uhd .tns', '#uhd .tns th', '#uhd .tns td',
      '.comiis_space_stats', '.comiis_space_statistics',
      '.comiis_space_num', '.comiis_space_data',
      '.comiis_space_info', '.space_stats', '.space-stat',
      '.user-stats', '.profile-stats', '[class*="space_stats"]',
      '[class*="profile_stats"]', '[class*="user_stats"]',
    ]) {
      for (final node in doc.querySelectorAll(selector)) {
        if (!containers.contains(node)) containers.add(node);
      }
    }

    for (final box in containers) {
      final text = _clean(box.text);
      if (text.isEmpty || text.length > 500) continue;
      final foundLabels = <String>[];
      for (final label in labels) {
        if (text.contains(label)) foundLabels.add(label);
      }
      if (foundLabels.isEmpty) continue;

      final direct = <String>[];
      for (final node in box.querySelectorAll('strong,b,em,span,p,li,th,td,a')) {
        final t = _clean(node.text);
        if (t.isEmpty || t.length > 30) continue;
        final n = number(t);
        if (n != null && RegExp(r'^\s*\d{1,12}\s*$').hasMatch(t)) direct.add(t);
      }
      if (foundLabels.length >= 2 && direct.length >= foundLabels.length) {
        for (var i = 0; i < foundLabels.length && i < direct.length; i++) {
          result.putIfAbsent(foundLabels[i], () => int.parse(direct[i]));
        }
      }

      // One stat may be rendered as number+label or label+number in the same
      // small element. Prefer the closest local pair and never use UID values
      // from the profile header.
      for (final label in labels) {
        if (result.containsKey(label)) continue;
        for (final node in box.querySelectorAll('li,div,span,p,th,td,a,strong,em')) {
          final t = _clean(node.text);
          if (t.isEmpty || t.length > 80 || !t.contains(label)) continue;
          final before = RegExp(r'(\d{1,12})[^0-9]{0,16}' + RegExp.escape(label)).firstMatch(t);
          final after = RegExp(RegExp.escape(label) + r'[^0-9]{0,16}(\d{1,12})').firstMatch(t);
          final m = before ?? after;
          final n = m == null ? null : int.tryParse(m.group(1)!);
          if (n != null) { result[label] = n; break; }
        }
      }
    }

    // Last resort: inspect elements whose class/id explicitly identifies the
    // metric. This is safer than scanning the entire page for a label because
    // the page also contains unrelated counters and UID numbers.
    final semantic = <String, List<String>>{
      '积分': ['points', 'point', 'credit', 'credits', 'integral'],
      '星币': ['coin', 'coins', 'money', 'extcredit', 'extcredits'],
    };
    for (final entry in semantic.entries) {
      if (result.containsKey(entry.key)) continue;
      for (final node in doc.querySelectorAll('*')) {
        final marker = '${node.id} ${node.classes.join(' ')}'.toLowerCase();
        if (!entry.value.any(marker.contains)) continue;
        final n = number(node.text);
        if (n != null && _clean(node.text).length <= 80) {
          result[entry.key] = n;
          break;
        }
      }
    }
    return result;
  }

'''
          if marker not in s:
              raise SystemExit('profile stats insertion marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

          dart format lib/services/profile_service.dart
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/profile_service.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: parse profile statistics by stat block"
            git push origin HEAD:main
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --dart-define=cronetHttpNoPlay=true
      - run: flutter build apk --release --dart-define=cronetHttpNoPlay=true
