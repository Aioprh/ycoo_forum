name: 自动修复 Dart 空安全构建问题

on:
  push:
    branches:
      - 'fix/native-actions-formhash-20260830'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 自动应用 Dart 官方修复
        run: dart fix --apply

      - name: 强化回帖令牌空安全
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/services/auth_service.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "final posttime = posttimeValue.isNotEmpty ? posttimeValue : '${DateTime.now().millisecondsSinceEpoch ~/ 1000}';",
              "final posttime = (posttimeValue ?? '').trim().isNotEmpty ? posttimeValue!.trim() : '${DateTime.now().millisecondsSinceEpoch ~/ 1000}';"
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: 格式化
        run: dart format lib

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 提交修复
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib .github/workflows/repair_nullability.yml
          if git diff --cached --quiet; then
            echo '没有需要提交的修复'
            exit 0
          fi
          git commit -m 'fix: 修复 Dart 空安全构建错误'
          git push origin HEAD:${GITHUB_REF_NAME}
