name: finish nested comment retry behavior
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/widgets/native_comment_list.dart')
          s = p.read_text(encoding='utf-8')
          old = '''      setState(() {\n        _loadingReplies = false;\n        _replyError = widget.comment.replyCount > 0 ? '$e' : null;\n      });'''
          new = '''      setState(() {\n        _loadingReplies = false;\n        // 请求失败时不保留空的楼中楼区域；父评论仍完整显示，按钮可再次重试。\n        _repliesExpanded = false;\n        _replyError = widget.comment.replyCount > 0 ? '$e' : null;\n      });'''
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/native_comment_list.dart
          git rm .github/workflows/_nested_retry_fix.yml
          git commit -m "fix: collapse nested replies after failed retry"
          git push
