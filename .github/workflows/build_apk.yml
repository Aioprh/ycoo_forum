name: 构建 YcoForum APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Flutter 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter(3.47.2 stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: 检查 Flutter 环境
        run: flutter --version && dart --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 运行测试
        # cronetHttpNoPlay=true:测试环境同步使用嵌入式 Cronet 定义,保证行为一致。
        run: flutter test --dart-define=cronetHttpNoPlay=true

      - name: 构建 APK
        id: build
        run: |
          # cronetHttpNoPlay=true:打包嵌入 Chromium 的 Cronet 引擎,
          # 不依赖 Google Play Services,在无 GMS 的设备上也能完成浏览器级 TLS 握手。
          flutter build apk --release --dart-define=cronetHttpNoPlay=true
          apk=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp "$apk" dist/ycooforum.apk
          echo "apk-path=dist/ycooforum.apk" >> "$GITHUB_OUTPUT"

      - name: 计算版本信息
        id: meta
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ycooforum-${{ steps.meta.outputs.version }}
          path: ${{ steps.build.outputs.apk-path }}
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Release(仅打 tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 源论坛 v${{ github.ref_name }}
          body: |
            ## 源论坛 YcoForum ${{ github.ref_name }}

            - Flutter 3.47.2 / Dart 3.13(stable)云端自动构建
            - APK 已用默认 debug 密钥签名,可直接安装
            - 阅读侧复刻,数据来自 https://www.ycoo.net
          files: ${{ steps.build.outputs.apk-path }}
          fail_on_unmatched_files: true