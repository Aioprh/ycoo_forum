name: 构建 YcoForum APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Flutter 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 修复个人资料积分解析
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/services/profile_service.dart')
          s = p.read_text(encoding='utf-8')
          old = "    final credits = _numberNearLabel(doc, ['星币', '源币', '金币', '余额']);\n    final points = _numberNearLabel(doc, ['积分', '贡献']);"
          new = "    final stats = _profileStats(doc);\n    final credits = stats['星币'] ?? _numberNearLabel(doc, ['星币', '源币', '金币', '余额']);\n    final points = stats['积分'] ?? _numberNearLabel(doc, ['积分', '贡献']);"
          if old in s and "final stats = _profileStats(doc);" not in s:
              s = s.replace(old, new, 1)
          marker = '  static int? _numberFromHref(dom.Document doc, bool Function(String href) matches) {'
          if 'static Map<String, int> _profileStats(dom.Document doc)' not in s:
              helper = r'''  static Map<String, int> _profileStats(dom.Document doc) {
    const labels = ['主题', '回帖', '关注', '粉丝', '星币', '积分'];
    final result = <String, int>{};

    int? exactNumber(String value) {
      final text = _clean(value);
      return RegExp(r'^\d{1,12}$').hasMatch(text) ? int.tryParse(text) : null;
    }

    int? nearby(String value, String label) {
      final text = _clean(value);
      final before = RegExp(r'(\d{1,12})[^0-9]{0,16}' + RegExp.escape(label)).firstMatch(text);
      final after = RegExp(RegExp.escape(label) + r'[^0-9]{0,16}(\d{1,12})').firstMatch(text);
      final m = before ?? after;
      return m == null ? null : int.tryParse(m.group(1)!);
    }

    // Ycoo's profile stats may be rendered as pairs or as one number row + one
    // label row. Restrict parsing to likely stat containers so UID values and
    // unrelated counters cannot become the积分 value.
    const selectors = [
      '#uhd .tns', '.comiis_space_stats', '.comiis_space_statistics',
      '.comiis_space_num', '.comiis_space_data', '.comiis_space_info',
      '.space_stats', '.space-stat', '.user-stats', '.profile-stats',
      '[class*="space_stats"]', '[class*="profile_stats"]', '[class*="user_stats"]',
    ];
    for (final selector in selectors) {
      for (final box in doc.querySelectorAll(selector)) {
        final boxText = _clean(box.text);
        if (boxText.isEmpty || boxText.length > 600) continue;

        for (final node in box.querySelectorAll('li,th,td,div,span,a,p,strong,em')) {
          final text = _clean(node.text);
          if (text.isEmpty || text.length > 80) continue;
          for (final label in labels) {
            if (!result.containsKey(label) && text.contains(label)) {
              final n = nearby(text, label);
              if (n != null) result[label] = n;
            }
          }
        }

        final numbers = <int>[];
        final names = <String>[];
        for (final node in box.querySelectorAll('strong,b,em,span,p,li,th,td,a')) {
          final text = _clean(node.text);
          final n = exactNumber(text);
          if (n != null) numbers.add(n);
          for (final label in labels) {
            if (text == label && !names.contains(label)) names.add(label);
          }
        }
        if (names.length >= 2 && numbers.length >= names.length) {
          for (var i = 0; i < names.length; i++) {
            result.putIfAbsent(names[i], () => numbers[i]);
          }
        }
      }
    }

    // Discuz/Ycoo may expose total credits through semantic id/class names.
    if (!result.containsKey('积分')) {
      for (final node in doc.querySelectorAll('*')) {
        final marker = '${node.id} ${node.classes.join(' ')}'.toLowerCase();
        if (!(marker.contains('credit') || marker.contains('point') || marker.contains('integral'))) continue;
        final text = _clean(node.text);
        final m = RegExp(r'(?<!\d)(\d{1,12})(?!\d)').firstMatch(text);
        if (m != null && text.length <= 80) {
          result['积分'] = int.tryParse(m.group(1)!);
          if (result['积分'] != null) break;
        }
      }
    }
    return result;
  }

'''
              if marker not in s:
                  raise SystemExit('profile stats insertion marker not found')
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          dart format lib/services/profile_service.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/profile_service.dart
          if ! git diff --cached --quiet; then
            git commit -m 'fix: parse profile statistics from stat block'
            git push origin HEAD:main
          fi

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter(3.47.2 stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: 检查 Flutter 环境
        run: flutter --version && dart --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 运行测试
        run: flutter test --dart-define=cronetHttpNoPlay=true

      - name: 构建 APK
        id: build
        run: |
          flutter build apk --release --dart-define=cronetHttpNoPlay=true
          apk=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp "$apk" dist/ycooforum.apk
          echo "apk-path=dist/ycooforum.apk" >> "$GITHUB_OUTPUT"

      - name: 计算版本信息
        id: meta
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ycooforum-${{ steps.meta.outputs.version }}
          path: ${{ steps.build.outputs.apk-path }}
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Release(仅打 tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 源论坛 v${{ github.ref_name }}
          body: |
            ## 源论坛 YcoForum ${{ github.ref_name }}
            - Flutter 3.47.2 / Dart 3.13(stable)云端自动构建
            - APK 已用默认 debug 密钥签名,可直接安装
            - 阅读侧复刻,数据来自 https://www.ycoo.net
          files: ${{ steps.build.outputs.apk-path }}
          fail_on_unmatched_files: true

      - name: Release build marker
        if: always()
        run: echo "build workflow executed on $GITHUB_SHA"
